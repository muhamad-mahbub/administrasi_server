name: Deploy Web Statis & Jalankan Compose

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web Statis
        uses: docker/build-push-action@v5
        with:
          context: ./pertemuan12/web-statis
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pertemuan11:latest

      - name: Copy docker-compose ke AWS & Eksekusi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p ~/pertemuan12
            
            # Bikin file docker-compose otomatis di server
            cat << 'EOF' > ~/pertemuan12/docker-compose.yml
            version: '3.8'
            services:
              web-statis:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/pertemuan11:latest
                container_name: web_statis_2388010014
                ports:
                  - "80:80"
                restart: always
              web-dinamis:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis-2388010014:latest
                container_name: web_dinamis_2388010014
                ports:
                  - "3000:3000"
                environment:
                  - DB_USER=userwebdinamis_2388010014
                  - DB_PASSWORD="O)xz6GWEwDOx1Ea9"
                  - DB_NAME=dbcompro
                  - DB_PORT=3306
                  - DB_HOST=host.docker.internal
                  - NEXTAUTH_SECRET=ini-adalah-kata-random
                  - NEXTAUTH_URL=http://${{ secrets.AWS_HOST }}:3000
                extra_hosts:
                  - "host.docker.internal:host-gateway"
                restart: always
            EOF
            
            # Nyalakan mesinnya!
            cd ~/pertemuan12
            docker compose down || true
            docker compose pull
            docker compose up -d